# watcher 設定檔。整個檔案可以省略 (或刪掉任何一行)，未指定的鍵會用內建預設值。
# 環境變數 WATCHER_<KEY> 會覆寫這裡的值；例如 `WATCHER_POLL_INTERVAL_SECONDS=2`。

# ---- 輪詢 / 觸發 -----------------------------------------------------------
# 全自動化設定：Stop hook 主觸發 (即時)，輪詢 60s 補位。killswitch 放寬以
# 容忍 codex 多輪自動決策；若擔心走火，調回保守值即可。
poll_interval_seconds      = 180     # fallback 輪詢間隔 (秒)
per_pane_cooldown_seconds  = 30     # 同一 pane 觸發後幾秒內不再觸發
max_responses_per_window   = 20     # killswitch：時間窗內最多回應次數 (全自動下放寬)
response_window_minutes    = 10     # killswitch 的時間窗 (分鐘)

# ---- Stop hook 通道 (TCP loopback) ----------------------------------------
# WezTerm/Windows 沒有 unix domain socket — daemon 在 127.0.0.1 上開 TCP server，
# claude-stop-notify.py 透過 TCP 推 pane id。binding 限 loopback，handler 再驗
# loopback 一次當 defense-in-depth。port 被占用會自動嘗試 +1..+10。
socket_enabled             = true       # 整體開關
socket_host                = "127.0.0.1"  # 通常不需要改；非 loopback 會被 handler 拒絕
socket_port                = 47823       # daemon 啟動時實際綁定的 port 會寫到 ~/.watcher/socket-info.json
socket_token               = ""          # 非空時 hook payload 必須帶相同 token (HMAC-style 共享祕密；多 user 環境可開)

# ---- Codex CLI ------------------------------------------------------------
codex_binary               = "codex"
codex_timeout_seconds      = 90     # codex exec 單次最長等待

# ---- 安全閘（窄門 / 不可逆動作 skip） ------------------------------------
# 預設 true：codex 看到 narrative 含「不可逆關鍵字」(rm / drop / force / push /
# merge / publish / release / 刪除 / 砍掉 / DROP TABLE / reset --hard / 推送 ...)
# 或用戶窄門標籤（`窄門 (a)/(b)/(c)` / `不可逆操作` / `irreversible`）時，回 skip
# value=`dangerous-narrative` 讓使用者自己決定。
# 設 false 進入全自動：上述情境也照常給 action（text / key / keys / enter）。
# **不受此 flag 影響的正確性 guard**（永遠開）：
#   - 機密問詢 skip（畫面要求密碼／API key／個資）
#   - `❯ <已有文字>` 場景禁 text（append 不是 replace，會串成亂碼）
#   - UI 不清楚 skip（footer 無提示、stage 算不準）
#   - 多步按鍵序列上限 10 tokens
#   - 滿意度問卷 / TUI modal skip
# 環境變數：WATCHER_SAFETY_GATE_ENABLED=false
safety_gate_enabled        = true

# ---- 預測 skip / 決策快取 (省 token) -------------------------------------
# 兩道便宜的前置過濾，避免畫面明顯不需要回答時還呼叫 Codex：
#   1) decision cache：codex 一旦回 skip，把 (清理後畫面 hash → 決策) 存進記憶體，
#      TTL 內同一畫面再出現直接短路。
#   2) skip 啟發式預測器：若分類為 `input`，但畫面回看視窗內找不到任何「問題標記」
#      (問號 / Do you / Continue / 是否 / 編號列表 ...)，視為閒置 prompt，直接短路。
# 觸發短路時 audit log 寫 outcome=cached-skip 或 predicted-skip。
skip_predictor_enabled          = true   # 關掉就只剩 cache 兜底
skip_predictor_lookback_lines   = 15     # 從 ❯ 往上看幾行非空行
skip_decision_cache_ttl_seconds = 600    # 0 = 不快取 (全自動下拉長 TTL)

# 自訂額外問題標記 (小寫子字串比對；命中即視為畫面有問題、會打 Codex)。
# 內建已含：?, ？, do you, would you, continue, confirm, press, choose,
# select, y/n, 是否, 要不要, 請選, 請輸入, 請問, 確認 ...等。
# 環境變數 WATCHER_SKIP_PREDICTOR_EXTRA_MARKERS 用逗號分隔。
skip_predictor_extra_markers    = []

# ---- 畫面擷取 -------------------------------------------------------------
# WezTerm 對 Claude Code 的 alt-screen 通常只能拿到 viewport (~40-50 行)；
# 設 100 起跳已足以涵蓋 classify() 最大 lookback (input 25 / menu 40 行)。
# 當畫面底部偵測到未閉合的邊框 (`╰` 多於 `╭`，例如 Plan Mode 多頁 plan 框)
# 會自動往上補抓，每次 +escalation_step，最多到 max；alt-screen 模式下 wezterm
# 通常會在 viewport 邊界回相同內容並停止 escalation。
capture_scrollback_lines        = 100    # 每次抓畫面含多少行 scrollback (初始)
capture_escalation_step         = 400    # 偵測到邊框截斷時，每次往上加抓的行數
max_capture_scrollback_lines    = 2000   # 自適應擷取的上限
# 送進 codex 的內容上限。先 `_clean_screen` 過濾 chrome，再 `_trim_to_current_decision`
# 裁切：若底部是 `╰` 結尾的邊框 (plan / 權限框)，只留從對應 `╭` 起算的當前 box；
# 否則只留最後 N 行 (純輸入框 / 純編號選單)。避免擷取上輪對話污染決策。
prompt_context_lines            = 60
hr_min_length                   = 50     # 偵測水平線時的最小 `─` 字元數

# ---- 日誌 ------------------------------------------------------------------
log_enabled                = false                            # 整體 log 開關。預設 false (畫面快照可能含 token，預設不落地)。改 true 才會寫 watcher.log 與 triggers/*.json
log_format                 = "%(asctime)s %(levelname)s %(message)s"  # Python logging 格式字串
log_datefmt                = "%Y-%m-%d %H:%M:%S"             # asctime 的時間格式
log_max_bytes              = 10_000_000                       # 單一 watcher.log 大小上限 (byte)，超過自動 rotate
log_backups                = 3                                # rotate 後保留幾份 (watcher.log.1, .2, ...)
log_retention_days         = 0                                # >0 時，每小時清掉 logs/triggers/ 內 mtime 超過 N 天的檔；0 = 永久保留

# 只把 audit triggers/*.json 與 codex-out-*.txt 限定在指定 pane (主 watcher.log
# 仍全量寫)。空 list (預設) = 全部都記。WezTerm pane id 是整數；歷史 "%N" 寫法
# 也接受 (`%` 前綴會被剝掉)。範例：[18, 19] 或 ["18", "19"] 或 ["%18", "%19"]。
# 環境變數 WATCHER_LOG_PANE_IDS="18,19" 用逗號分隔。
log_pane_ids               = []
